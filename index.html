<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau — suite bureautique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,400;0,700;1,400&family=Open+Sans:ital,wght@0,400;0,700;1,400&family=Lato:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,400;0,700;1,400&family=Poppins:ital,wght@0,400;0,700;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--bg:#f4f5f7;--line:#e2e4e8;--line2:#d3d6db;--text:#1d2129;--muted:#6b7280;--doc:#2b6be0;--sheet:#1e8a4c;--slides:#d24726;--pdf:#b3261e;--k:#2b6be0;--hover:#eef0f3}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--ui);color:var(--text);background:var(--bg);overflow:hidden;font-size:14px}
button{font-family:inherit;color:inherit}
input,select,textarea{font-family:inherit}
.ic{width:18px;height:18px;flex:none}
.ic.sm,.ic.car{width:12px;height:12px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:#fff;cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--text);border-color:var(--text);color:#fff}
.btn.primary:hover{background:#000}
.btn.danger.primary{background:#c5221f;border-color:#c5221f}
.btn.sm{height:26px;padding:0 10px;font-size:12.5px;border-radius:6px}
.btn.ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.24)}
.inp{height:34px;border:1px solid var(--line2);border-radius:7px;padding:0 10px;font-size:14px;outline:none;width:100%;background:#fff}
.inp:focus{border-color:var(--k);box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 18%,transparent)}

/* ---------- Home ---------- */
#home{height:100%;overflow:auto}
.h-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:12px 28px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.h-search{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:20px;background:#f1f3f5;color:var(--muted)}
.h-search input{flex:1;border:0;background:transparent;outline:none;font-size:14px;color:var(--text)}
.h-inner{max-width:1080px;margin:0 auto;padding:0 28px}
.h-create{background:#fff;border-bottom:1px solid var(--line);padding:22px 0 26px}
.h-create h2,.h-recent h2{font-size:15px;font-weight:600;margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.tile{cursor:pointer;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-self:start}
.tile .pv{height:118px;border-radius:10px;border:1px solid var(--line2);overflow:hidden;position:relative;transition:.15s;background:#fff}
.tile:hover .pv{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.tile .tl{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:13px;font-weight:500}
.tile .tl small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.pv-doc{padding:16px 22px;display:flex;flex-direction:column;gap:7px;background:#fff}
.pv-doc i{display:block;height:5px;border-radius:3px;background:#e5e7eb}
.pv-doc i.t{width:55%;height:8px;background:#9db8ee}
.pv-doc i.s{width:60%}
.pv-doc i.r{align-self:flex-end;width:40%}
.pv-sheet{background-color:#fff;background-image:linear-gradient(#e5e7eb 1px,transparent 1px),linear-gradient(90deg,#e5e7eb 1px,transparent 1px);background-size:34px 16px}
.pv-sheet .hdr{position:absolute;left:0;right:0;top:0;height:16px;background:#e9f3ed;border-bottom:1px solid #b9dcc6}
.pv-sheet .bars{position:absolute;right:14px;bottom:12px;display:flex;align-items:flex-end;gap:4px}
.pv-sheet .bars b{width:9px;background:#1e8a4c;border-radius:2px 2px 0 0}
.pv-slides{display:flex;align-items:center;justify-content:center;background:#f4f5f7}
.pv-sl{width:86%;aspect-ratio:16/9;background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.pv-sl b{width:55%;height:8px;border-radius:3px;background:#f0b4a3}
.pv-sl i{width:35%;height:5px;border-radius:3px;background:#e5e7eb}
.pv-sl.ocean{background:#0f4c75}
.pv-sl.ocean b{background:#fff}.pv-sl.ocean i{background:#3fc1c9}
.pv-plus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.pv-plus span{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.h-recent{padding:26px 0 60px}
.h-rh{display:flex;align-items:baseline;gap:12px}
.h-where{color:var(--muted);font-size:12.5px}
.flist{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.frow{display:grid;grid-template-columns:36px 1fr 130px 150px 120px 36px;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.frow:last-child{border-bottom:0}
.frow:hover{background:#f8f9fa}
.frow .fn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fm{color:var(--muted);font-size:12.5px}
.fhead{cursor:default;background:#fafbfc;font-size:12px;color:var(--muted);font-weight:500}
.fhead:hover{background:#fafbfc}
.badge{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.badge .dot{width:7px;height:7px;border-radius:50%;background:#1e8a4c}
.badge .dot.l{background:#e8a33d}
.empty{padding:46px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}
.h-drop{color:var(--muted);font-size:12.5px;margin-top:14px;text-align:center}
.kb{display:inline-flex;align-items:center;justify-content:center;border-radius:7px;flex:none}
.kb svg{width:62%;height:62%}
.kb-doc{background:var(--doc)}.kb-sheet{background:var(--sheet)}.kb-slides{background:var(--slides)}.kb-pdf{background:var(--pdf)}
.dropzone{position:fixed;inset:0;z-index:900;background:rgba(43,107,224,.1);border:3px dashed var(--doc);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--doc);pointer-events:none}
@media (max-width:760px){.frow{grid-template-columns:32px 1fr 36px}.frow .fm{display:none}.h-top{padding:10px 14px;gap:10px}.h-inner{padding:0 14px}.h-top .btn span{display:none}}

/* ---------- App shell ---------- */
#app{height:100%;display:flex;flex-direction:column}
#app[data-kind=doc]{--k:var(--doc)}#app[data-kind=sheet]{--k:var(--sheet)}#app[data-kind=slides]{--k:var(--slides)}#app[data-kind=pdf]{--k:var(--pdf)}
.topbar{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--k);color:#fff}
.tb-home{width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tb-home:hover{background:rgba(255,255,255,.18)}
.fname{background:transparent;border:1px solid transparent;color:#fff;font-size:15px;font-weight:600;height:32px;padding:0 8px;border-radius:6px;min-width:120px;width:340px;max-width:40vw;outline:none}
.fname:hover{border-color:rgba(255,255,255,.35)}
.fname:focus{background:#fff;color:var(--text)}
.savestate{font-size:12.5px;opacity:.85;white-space:nowrap}
#ribbon{flex:none;background:#fff;border-bottom:1px solid var(--line);user-select:none}
.rb-tabs{display:flex;gap:2px;padding:4px 10px 0;overflow-x:auto}
.rb-tab{border:0;background:transparent;padding:7px 12px 8px;font-size:13px;cursor:pointer;border-radius:6px 6px 0 0;color:#444;position:relative;white-space:nowrap}
.rb-tab:hover{background:var(--hover)}
.rb-tab.on{color:var(--k);font-weight:600}
.rb-tab.on::after{content:'';position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px;background:var(--k)}
.rb-panel{display:flex;align-items:stretch;padding:6px 6px 4px;overflow-x:auto;border-top:1px solid var(--line);background:#fbfbfc;min-height:86px}
.rg{display:flex;flex-direction:column;padding:0 8px;border-right:1px solid var(--line);flex:none}
.rg:last-child{border-right:0}
.rg-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px}
.rrow{display:flex;align-items:center;gap:2px}
.rg-label{font-size:10.5px;color:var(--muted);text-align:center;padding-top:2px;white-space:nowrap}
.tb{height:28px;min-width:28px;border:0;background:transparent;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0 5px;color:#333;font-size:12.5px;white-space:nowrap}
.tb:hover{background:#e9ebef}
.tb.on{background:color-mix(in srgb,var(--k) 16%,#fff);color:var(--k)}
.tb.big{flex-direction:column;height:58px;min-width:54px;padding:4px 6px;gap:3px;font-size:11.5px}
.tb.big .ic{width:24px;height:24px}
.tbt{font-weight:600;font-size:13px;min-width:12px}
.tb.cbtn{position:relative;gap:1px;padding-right:2px}
.cbar{position:absolute;left:6px;bottom:3px;width:17px;height:3px;border-radius:1px}
.tsel{height:28px;border:1px solid var(--line2);border-radius:5px;background:#fff;font-size:12.5px;padding:0 4px;cursor:pointer;outline:none}
.tsel:focus{border-color:var(--k)}
#workspace{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:#e9ebee}
.statusbar{height:26px;flex:none;display:flex;align-items:center;gap:16px;padding:0 14px;font-size:12px;color:#555;background:#f7f8f9;border-top:1px solid var(--line)}
.statusbar .zr{width:110px;accent-color:var(--k)}
.statusbar .zl{width:44px;text-align:right}

/* menus, modals, toast */
.menu{position:fixed;z-index:1100;min-width:200px;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:6px;max-height:80vh;overflow:auto}
.menu-it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;text-align:left}
.menu-it:hover{background:var(--hover)}
.menu-it.danger{color:#c5221f}
.menu-it .hint{margin-left:auto;color:var(--muted);font-size:11.5px}
.menu-sep{height:1px;background:var(--line);margin:5px 4px}
.pal{display:grid;grid-template-columns:repeat(10,20px);gap:3px;padding:6px}
.sw{width:20px;height:20px;border-radius:4px;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0}
.sw:hover{transform:scale(1.15)}
.pal-custom{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;font-size:12.5px;color:#444}
.pal-custom input{width:34px;height:24px;border:0;padding:0;background:none;cursor:pointer}
.tpick-l{font-size:12.5px;padding:4px 6px 6px;color:#444}
.tpick{display:grid;grid-template-columns:repeat(10,18px);gap:3px;padding:0 6px 6px}
.tp{width:18px;height:18px;border:1px solid var(--line2);border-radius:2px;cursor:pointer;background:#fff}
.tp.on{background:color-mix(in srgb,var(--k) 25%,#fff);border-color:var(--k)}
.symgrid{display:grid;grid-template-columns:repeat(8,30px);gap:3px;padding:4px}
.symgrid button{height:30px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer;font-size:15px}
.symgrid button:hover{background:var(--hover)}
.mdl-ov{position:fixed;inset:0;z-index:1200;background:rgba(15,20,30,.35);display:flex;align-items:center;justify-content:center;padding:20px}
.mdl{width:420px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mdl-h{padding:18px 20px 6px;font-weight:600;font-size:16px}
.mdl-b{padding:8px 20px;overflow:auto;color:#333;line-height:1.5}
.mdl-b p{margin:0 0 8px}
.mdl-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px 18px}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:#555;font-weight:500}
.fhelp{width:100%;border-collapse:collapse;font-size:12.5px}
.fhelp td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.fhelp code{font-family:ui-monospace,Menlo,monospace;color:var(--sheet);font-size:12px}
#toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:1300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#202124;color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:.3s;max-width:90vw}
.toast.err{background:#b3261e}
.toast.out{opacity:0;transform:translateY(6px)}
.busy{position:fixed;inset:0;z-index:1250;background:rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:500}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #d6d9de;border-top-color:var(--k);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Document ---------- */
.doc-scroll{flex:1;overflow:auto;padding:28px 20px 60px;position:relative}
.doc-wrap{width:fit-content;margin:0 auto}
.doc-page{background:#fff;width:794px;min-height:1123px;padding:96px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 6px 24px rgba(0,0,0,.06);outline:none;font-family:Arial,sans-serif;font-size:11pt;line-height:1.15;color:#111;overflow-wrap:break-word;caret-color:#111}
.doc-page p{margin:0 0 6pt}
.doc-page h1{font-size:20pt;margin:12pt 0 6pt;font-weight:700}
.doc-page h2{font-size:16pt;margin:10pt 0 6pt;font-weight:700}
.doc-page h3{font-size:13pt;margin:8pt 0 4pt;font-weight:700}
.doc-page blockquote{margin:0 0 6pt;padding-left:14px;border-left:3px solid #c9ccd1;color:#555;font-style:italic}
.doc-page pre{font-family:'Courier New',monospace;background:#f5f6f8;padding:8px 10px;border-radius:4px;white-space:pre-wrap;margin:0 0 6pt}
.doc-page ul,.doc-page ol{margin:0 0 6pt;padding-left:28px}
.doc-page table{border-collapse:collapse;width:100%;margin:0 0 6pt}
.doc-page td,.doc-page th{border:1px solid #9aa0a6;padding:4px 7px;vertical-align:top;min-width:24px}
.doc-page img{max-width:100%;cursor:pointer}
.doc-page img.img-sel{outline:2px solid var(--doc);outline-offset:2px}
.doc-page a{color:#0b57d0}
.doc-page hr{border:0;border-top:1px solid #9aa0a6;margin:8pt 0}
.doc-page .page-break{border-top:1px dashed #9aa0a6;margin:14px -40px;height:0;position:relative;user-select:none}
.doc-page .page-break::after{content:'Saut de page';position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:#fff;color:#9aa0a6;font:11px var(--ui);padding:0 8px}
.img-bar{position:absolute;z-index:20;display:flex;align-items:center;gap:2px;padding:4px;background:#fff;border:1px solid var(--line2);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.img-bar .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.link-tip{position:absolute;z-index:20;display:flex;align-items:center;gap:10px;padding:6px 10px;background:#fff;border:1px solid var(--line2);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.14);font-size:12.5px}
.link-tip a{color:#0b57d0}
.link-tip .lk{border:0;background:none;color:#c5221f;cursor:pointer;font-size:12.5px}
.find-panel{position:absolute;top:10px;right:24px;z-index:30;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:10px;display:flex;flex-direction:column;gap:6px;width:340px}
.fp-row{display:flex;gap:4px;align-items:center}
.fp-row .inp{height:30px;font-size:13px}
.fp-info{font-size:12px;color:var(--muted);min-height:15px;padding-left:2px}

/* ---------- Sheet ---------- */
.sh-bar{height:34px;flex:none;display:flex;align-items:center;gap:0;background:#fff;border-bottom:1px solid var(--line)}
.namebox{width:96px;height:100%;border:0;border-right:1px solid var(--line);padding:0 10px;font-size:13px;outline:none;text-align:center}
.fxl{width:36px;text-align:center;color:#777;font-family:Georgia,serif;font-size:15px;border-right:1px solid var(--line);height:100%;display:flex;align-items:center;justify-content:center}
.fbar{flex:1;height:100%;border:0;padding:0 10px;font-size:13.5px;outline:none;font-family:ui-monospace,Menlo,Consolas,monospace}
.sh-scroll{flex:1;overflow:auto;background:#fff;position:relative;outline:none}
.sh-wrap{position:relative;width:max-content;padding-bottom:60px}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;font-family:Calibri,Carlito,Arial,sans-serif;font-size:14px;color:#111}
.grid th{position:sticky;background:#f3f4f6;color:#5f6368;font-weight:500;font-size:12px;border-right:1px solid #d6d9de;border-bottom:1px solid #d6d9de;user-select:none;font-family:var(--ui)}
.grid thead th{top:0;height:23px;z-index:3;cursor:s-resize;position:sticky}
.grid tbody th{left:0;z-index:2;cursor:e-resize}
.grid thead th.corner{left:0;z-index:4;cursor:se-resize}
.grid th.hl{background:#dfe9e3;color:#14623a}
.grid td{height:22px;border-right:1px solid #e6e8eb;border-bottom:1px solid #e6e8eb;padding:0 4px;overflow:hidden;white-space:nowrap;cursor:cell;line-height:21px}
.grid td.bd{box-shadow:inset -1px -1px 0 #3c4043,inset 1px 1px 0 #3c4043}
.rs{position:absolute;right:-3px;top:0;width:6px;height:100%;cursor:col-resize;z-index:5}
.sel-box{position:absolute;border:2px solid var(--sheet);pointer-events:none;z-index:1}
.sel-box.multi{background:rgba(30,138,76,.08)}
.act-box{position:absolute;border:1px solid var(--sheet);pointer-events:none;z-index:1;background:transparent}
.fill-h{position:absolute;width:8px;height:8px;background:var(--sheet);border:1.5px solid #fff;cursor:crosshair;z-index:2}
.fill-prev{position:absolute;border:2px dashed #5f6368;pointer-events:none;z-index:1}
.cell-input{position:absolute;z-index:6;border:2px solid var(--sheet);font-family:Calibri,Carlito,Arial,sans-serif;font-size:14px;padding:0 3px;outline:none;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.sh-more{position:absolute;left:52px;bottom:16px;display:flex;gap:8px}
.sh-foot{height:34px;flex:none;display:flex;align-items:stretch;background:#f3f4f6;border-top:1px solid var(--line)}
.sh-tabs{display:flex;align-items:stretch;gap:1px;padding:0 8px;overflow-x:auto;flex:1}
.stab{padding:0 16px;display:flex;align-items:center;cursor:pointer;font-size:13px;color:#444;white-space:nowrap;border-right:1px solid var(--line)}
.stab:hover{background:#e9ebef}
.stab.on{background:#fff;color:var(--sheet);font-weight:600;box-shadow:inset 0 -3px 0 var(--sheet)}
.stab-in{width:110px;border:1px solid var(--sheet);font-size:13px;padding:0 6px;outline:none;margin:4px 0}
.stab-add{align-self:center;margin-left:4px}
.sh-stat{display:flex;align-items:center;gap:16px;padding:0 14px;font-size:12px;color:#555;white-space:nowrap}
.chart-box{position:absolute;z-index:4;background:#fff;border:1px solid var(--line2);border-radius:8px;box-shadow:0 3px 14px rgba(0,0,0,.12);display:flex;flex-direction:column;font-family:var(--ui)}
.chart-head{height:32px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px 0 8px;border-bottom:1px solid var(--line);cursor:move;opacity:.55;transition:opacity .15s}
.chart-box:hover .chart-head{opacity:1}
.chart-head .grip{color:#777;display:flex}
.ch-title{flex:1;min-width:60px;border:0;font-size:12.5px;outline:none;background:transparent;font-weight:600}
.ch-range{width:84px;border:1px solid var(--line);border-radius:4px;font-size:11.5px;height:24px;padding:0 5px;outline:none}
.chart-head .tsel{height:24px;font-size:11.5px}
.chart-body{flex:1;position:relative;min-height:0;padding:6px 8px 8px}
.ch-rz{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,#b0b4ba 50%,#b0b4ba 60%,transparent 60%,transparent 70%,#b0b4ba 70%,#b0b4ba 80%,transparent 80%);border-radius:0 0 8px 0}

/* ---------- Slides ---------- */
.sl-main{flex:1;display:flex;min-height:0}
.sl-thumbs{width:206px;flex:none;overflow-y:auto;background:#f3f4f6;border-right:1px solid var(--line);padding:12px 10px 20px}
.thumb{display:flex;gap:6px;margin-bottom:12px;cursor:pointer;position:relative}
.thumb .num{width:16px;font-size:12px;color:#666;text-align:right;padding-top:3px;flex:none}
.thumb .tw{width:164px;overflow:hidden;border:2px solid transparent;border-radius:5px;position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.16)}
.thumb:hover .tw{border-color:#c4c8ce}
.thumb.on .tw{border-color:var(--slides)}
.thumb.drop-b::before,.thumb.drop-a::after{content:'';position:absolute;left:20px;right:0;height:3px;background:var(--slides);border-radius:2px}
.thumb.drop-b::before{top:-8px}.thumb.drop-a::after{bottom:-8px}
.tw .slide{pointer-events:none}
.thumb-add{width:100%;height:36px;margin-top:4px;border:1px dashed #b9bdc3;border-radius:6px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:#555}
.thumb-add:hover{background:#fff}
.sl-center{flex:1;display:flex;flex-direction:column;min-width:0}
.sl-stagewrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;min-height:0}
.sl-stage{position:relative;box-shadow:0 2px 6px rgba(0,0,0,.14),0 10px 30px rgba(0,0,0,.08);flex:none}
.slide{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#fff}
.sel-el{position:absolute}
.sel-el img{width:100%;height:100%;display:block;user-select:none;pointer-events:none}
.sel-el .shp{position:absolute;left:0;top:0;overflow:visible}
.sel-el .tx{position:absolute;inset:0;padding:8px 10px;display:flex;flex-direction:column;outline:none;overflow-wrap:break-word;line-height:1.2;white-space:pre-wrap}
.sel-el .tx>*{white-space:pre-wrap}
.sel-el .tx ul,.sel-el .tx ol{margin:0;padding-left:1.15em}
.sel-el .tx li{margin:.15em 0}
.sel-el .tx p{margin:0}
.sel-el .tx table{border-collapse:collapse;width:100%}
.sel-el .tx td{border:1px solid rgba(128,128,128,.5);padding:4px 6px}
.slide.editing .sel-el{cursor:move}
.slide.editing .sel-el .tx[contenteditable=true]{cursor:text;user-select:text}
.slide.editing .sel-el:hover{outline:calc(1px * var(--inv,1)) dashed rgba(120,120,120,.6)}
.slide.editing .tx[data-ph]:empty::before{content:attr(data-ph);color:#9aa0a6;opacity:.9}
.slide.editing .t-text .tx:empty{outline:calc(1px * var(--inv,1)) dashed #c2c6cc}
.sel-frame{position:absolute;border:calc(1.5px * var(--inv,1)) solid var(--slides);pointer-events:none;z-index:50}
.sel-frame.editing{border-style:dashed}
.hd{position:absolute;width:calc(10px * var(--inv,1));height:calc(10px * var(--inv,1));background:#fff;border:calc(1.5px * var(--inv,1)) solid var(--slides);border-radius:calc(2px * var(--inv,1));pointer-events:auto;transform:translate(-50%,-50%)}
.hd[data-h=nw]{left:0;top:0;cursor:nwse-resize}.hd[data-h=n]{left:50%;top:0;cursor:ns-resize}.hd[data-h=ne]{left:100%;top:0;cursor:nesw-resize}.hd[data-h=e]{left:100%;top:50%;cursor:ew-resize}.hd[data-h=se]{left:100%;top:100%;cursor:nwse-resize}.hd[data-h=s]{left:50%;top:100%;cursor:ns-resize}.hd[data-h=sw]{left:0;top:100%;cursor:nesw-resize}.hd[data-h=w]{left:0;top:50%;cursor:ew-resize}
.guide{position:absolute;background:#e8467c;z-index:49;pointer-events:none}
.guide.v{top:0;bottom:0;width:calc(1px * var(--inv,1))}.guide.h{left:0;right:0;height:calc(1px * var(--inv,1))}
.sl-notes{height:76px;flex:none;border:0;border-top:1px solid var(--line);resize:none;padding:10px 16px;font-size:13px;outline:none;background:#fff}
.theme-sw{width:64px;height:40px;border-radius:5px;border:1px solid var(--line2);cursor:pointer;display:flex;flex-direction:column;justify-content:center;padding:0 8px;gap:4px}
.theme-sw:hover{outline:2px solid var(--slides)}
.theme-sw b{height:5px;width:70%;border-radius:2px}
.theme-sw i{height:3px;width:45%;border-radius:2px}
.present{position:fixed;inset:0;z-index:1000;background:#000;display:flex;align-items:center;justify-content:center;cursor:default}
.pr-holder{position:relative;overflow:hidden}
.pr-in{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.pr-info{position:absolute;bottom:12px;right:18px;color:rgba(255,255,255,.5);font-size:13px}
.pr-exit{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s}
.present:hover .pr-exit{opacity:1}

/* ---------- PDF ---------- */
.pdf-scroll{flex:1;overflow:auto;padding:24px 16px 60px}
.pdf-page{margin:0 auto 18px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15),0 6px 20px rgba(0,0,0,.06);position:relative}
.pdf-page canvas{display:block;width:100%;height:100%}
.pdf-page .pn{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:11px;color:#777}
</style>

const meta=f=>({id:f.id,name:f.name,kind:f.kind,updated:f.updated});
const Store={
  db:null,uid:null,cloud:false,cloudOk:null,cache:new Map(),chains:new Map(),
  LK:'bureau.index',
  lIndex(){ try{ return JSON.parse(localStorage.getItem(this.LK)||'[]'); }catch{ return []; } },
  lSetIndex(a){ try{ localStorage.setItem(this.LK,JSON.stringify(a)); }catch{} },
  lGet(id){ try{ return JSON.parse(localStorage.getItem('bureau.f.'+id)||'null'); }catch{ return null; } },
  lPut(f){ try{ localStorage.setItem('bureau.f.'+f.id,JSON.stringify(f)); const idx=this.lIndex().filter(m=>m.id!==f.id); idx.push(meta(f)); this.lSetIndex(idx); return true; }catch{ return false; } },
  lDel(id){ try{ if(localStorage.getItem('bureau.f.'+id)!==null) localStorage.removeItem('bureau.f.'+id); const idx=this.lIndex(); if(idx.some(m=>m.id===id)) this.lSetIndex(idx.filter(m=>m.id!==id)); }catch{} },
  col(){ return this.db.doc('data/users/'+this.uid+'/drive').collection('files'); },
  async list(){
    const out=new Map(); for(const m of this.lIndex()) out.set(m.id,{...m,where:'local'});
    if(this.cloud){ try{ const snap=await withTimeout(this.col().get(),10000); for(const d of snap.docs){ const f=d.data(); if(!f||!f.id) continue; this.cache.set(f.id,f); out.set(f.id,{...meta(f),where:'cloud'}); } this.cloudOk=true; }catch{ this.cloudOk=false; } }
    return [...out.values()].sort((a,b)=>(b.updated||0)-(a.updated||0));
  },
  async get(id){
    if(this.cache.has(id)) return JSON.parse(JSON.stringify(this.cache.get(id)));
    const l=this.lGet(id); if(l) return l;
    if(this.cloud){ try{ const s=await this.col().doc(id).get(); if(s.exists) return JSON.parse(JSON.stringify(s.data())); }catch{} }
    return null;
  },
  save(f){ const prev=this.chains.get(f.id)||Promise.resolve(); const p=prev.then(()=>this._save(f)).catch(()=>({where:'none'})); this.chains.set(f.id,p); return p; },
  async _save(f){
    const data=JSON.parse(JSON.stringify(f)); delete data.forceLocal;
    if(this.cloud&&!f.forceLocal){
      for(let attempt=0;attempt<2;attempt++){
        try{ await this.col().doc(f.id).set(data); this.cache.set(f.id,data); this.lDel(f.id); return {where:'cloud'}; }
        catch(e){ const c=e?.code; if(c==='unavailable'&&attempt===0){ await sleep(600+Math.random()*900); continue; } if(c==='invalid_argument'||c==='quota_exceeded') f.forceLocal=true; break; }
      }
    }
    return {where:this.lPut(data)?'local':'none'};
  },
  async remove(id){ this.lDel(id); this.cache.delete(id); if(this.cloud){ try{ await this.col().doc(id).delete(); }catch{} } },
};

  }catch{}
}

    const nr=Object.values(rels).find(r=>r.type.endsWith('/notesSlide'))?.target; let notes=''; if(nr){ const nd=await xml(nr); if(nd){ const sps=byTag(nd,'sp').filter(sp=>byTag(sp,'ph')[0]?.getAttribute('type')==='body'); notes=sps.map(sp=>byTag(sp,'p').map(p=>byTag(p,'t').map(t=>t.textContent).join('')).join('\n')).join('\n').trim(); } }
    slides.push({id:uid(),bg,els,notes});
  }
  if(!slides.length) throw new Error('Aucune diapositive trouvée');
  return {slides,h:H,theme:'blanc'};
}
async function importFile(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase(); const base=file.name.replace(/\.[^.]+$/,'')||file.name;
  if(ext==='pdf'){ openPdf(file); return; }
  if(['doc','ppt','pps','odt','odp','rtf','pages','key','numbers'].includes(ext)){ toast(`Le format .${ext} n’est pas pris en charge. Enregistre-le d’abord en .docx, .xlsx ou .pptx.`,'err'); return; }
  const done=busy('Ouverture de « '+file.name+' »…');
  try{
    if(ext==='docx'){ await need('mammoth'); const r=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()}); const tmp=el('div',{html:sanitizeHtml(r.value||'')}); for(const img of tmp.querySelectorAll('img')){ const s=img.getAttribute('src'); if(s&&s.length>400000){ const out=await shrinkDataURL(s,1400,/^data:image\/png/.test(s)); img.setAttribute('src',out.src); } } done(); createFile('doc',base,{html:tmp.innerHTML||'<p><br></p>',page:{orient:'portrait',margin:'normal'}}); }
    else if(['txt','md','markdown'].includes(ext)){ const t=await file.text(); done(); createFile('doc',base,{html:textToHtml(t,ext!=='txt'),page:{orient:'portrait',margin:'normal'}}); }
    else if(['html','htm'].includes(ext)){ const t=await file.text(); done(); createFile('doc',base,{html:sanitizeHtml(t)||'<p><br></p>',page:{orient:'portrait',margin:'normal'}}); }
    else if(['xlsx','xls','xlsm','xlsb','ods'].includes(ext)){ await need('xlsx'); const c=importWorkbook(new Uint8Array(await file.arrayBuffer())); done(); createFile('sheet',base,c); }
    else if(['csv','tsv'].includes(ext)){ await need('xlsx'); let t=await file.text(); if(t.charCodeAt(0)===0xFEFF) t=t.slice(1); const first=t.split(/\r?\n/)[0]||''; let c; if(ext==='tsv'||first.includes('\t')||(first.split(';').length>first.split(',').length)){ const sep=ext==='tsv'||first.includes('\t')?'\t':';'; const sh=newSheet('Feuil1'); const rows=parseCSV(t,sep); sh.rows=Math.max(200,rows.length+20); sh.cols=Math.max(26,Math.min(100,Math.max(...rows.map(r=>r.length))+2)); rows.slice(0,3000).forEach((r,i)=>r.slice(0,100).forEach((v,j)=>{ if(v!=='') sh.cells[addr(i,j)]={v:v[0]==='='?"'"+v:v}; })); c={sheets:[sh],active:0}; } else c=importWorkbook(t,true); done(); createFile('sheet',base,c); }
    else if(ext==='pptx'){ const c=await importPptx(await file.arrayBuffer()); done(); createFile('slides',base,c); }
    else if(file.type.startsWith('image/')){ const im=await prepImage(file,1400); done(); createFile('doc',base,{html:`<p><img src="${im.src}" style="max-width:100%"></p><p><br></p>`,page:{orient:'portrait',margin:'normal'}}); }
    else { done(); toast('Ce type de fichier n’est pas pris en charge.','err'); }
  }catch(e){ done(); console.error(e); toast('Impossible d’ouvrir ce fichier : '+(e.message||'format non reconnu'),'err'); }
}
function parseCSV(t,sep){ const rows=[]; let row=[],f='',q=false; for(let i=0;i<t.length;i++){ const ch=t[i]; if(q){ if(ch==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; } else if(ch==='"') q=true; else if(ch===sep){ row.push(f); f=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; } else f+=ch; } if(f!==''||row.length){ row.push(f); rows.push(row); } return rows; }
